[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gt7-companion-by-qshi"
description = "Unofficial dashboard and stream overlay for Gran Turismo 7 telemetry – for tablets, PCs, Macs and OBS."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "qshi" }]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "pycryptodome>=3.20",
    "platformdirs>=4",
    "ifaddr>=0.2",
    "segno>=1.6",
]

[project.urls]
Homepage = "https://github.com/qshiqshi/gt7-companion-by-qshi"
Issues = "https://github.com/qshiqshi/gt7-companion-by-qshi/issues"

[project.optional-dependencies]
box = ["sounddevice>=0.4"]          # the Box on this computer's loudspeakers
app = ["pystray>=0.19", "pillow>=10"]     # menu bar / tray symbol
wake = [                                 # "Hey Box": speech recognition on this computer
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "sounddevice>=0.4",
]
dev = ["httpx2>=2"]

[project.scripts]
gt7companion = "gt7companion.cli:main"
gt7companion-app = "gt7companion.launcher:main"

[tool.setuptools.dynamic]
version = { attr = "gt7companion.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gt7companion = ["web/**/*", "data/**/*"]
